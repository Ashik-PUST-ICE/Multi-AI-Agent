name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load host-managed project .env
        env:
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
        run: |
          test -n "$DEPLOY_ENV_FILE"
          test -f "$DEPLOY_ENV_FILE"
          install -m 600 "$DEPLOY_ENV_FILE" .env
      - name: Verify the host-managed project .env
        run: |
          test -f .env
          docker compose config --quiet
      - name: Build and start data services
        run: |
          docker compose build app web worker scheduler
          docker compose up -d --wait db redis
      - name: Apply database migrations
        run: docker compose --profile maintenance run --rm migrate
      - name: Start application services
        run: docker compose up -d --wait app web worker scheduler
      - name: Remove deployment environment file from checkout
        if: always()
        run: rm -f .env
